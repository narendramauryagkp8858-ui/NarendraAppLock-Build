
name: Build Narendra AppLock APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -q Narendra_AppLock_Phone_Build_Ready.zip -d project

      - name: Enable AndroidX and Build APK
        run: |
          cd project/NarendraAppLock
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Narendra-AppLock-APK
          path: project/NarendraAppLock/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
