name: Build Narendra AppLock APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract ZIP
        run: |
          unzip -q Narendra_AppLock_Phone_Build_Ready.zip -d project

       - name: Build Android project
        run: |
          cd project/NarendraAppLock
          gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Narendra-AppLock-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
